<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EM Studio — Lavori</title>
<!-- the font loads without holding up the first paint: until it arrives the page shows
     in its own colour with a fallback face, never as a blank white screen -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --navy:#091956;--paper:#f6f7fb;--mist:#d5dbee;--body:#2a3150;--muted:#4a5378;--pale:#c7cee7;
  --ease:cubic-bezier(.2,.7,.1,1);
  --font:Montserrat,system-ui,sans-serif;
  --pad:clamp(16px,3.2vw,46px);
  --logo-h:min(11.8vw,131px);
  --dock-s:.27;                      /* the logo's size docked in the corner, as on the home page */
  --top:calc(var(--pad) * 2 + 90px); /* where the row of photos starts */
  --gap:clamp(20px,3.4vw,60px);
}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--navy);font-family:var(--font);}
body{touch-action:none;}
/* on the way out the page turns to the colour of the one it is going to (set in leave) */
body{transition:background-color .75s ease;}

.corner{position:fixed;z-index:20;margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:color .4s,opacity .4s;}
.corner--tr{top:var(--pad);right:var(--pad);display:flex;gap:14px;letter-spacing:.04em;text-transform:none;font-size:13px;color:var(--navy);}
.corner--tr a{color:inherit;text-decoration:none;}
.corner--tr a[aria-current]{text-decoration:underline;text-underline-offset:4px;}

/* the logo, docked small in the top left corner as on the home page; it
   arrives from (and leaves for) the middle, whole, at the home page's size */
.mark{
  position:fixed;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;gap:.6vw;
  pointer-events:none;
  transform:translate(calc(-50% + var(--pad) + var(--logo-w,440px) * var(--dock-s) / 2),calc(-50% + var(--pad) + var(--logo-h) * var(--dock-s) / 2)) scale(var(--dock-s));
  /* slow and calm, on a layer of its own so the row moving under it never holds it up */
  transition:transform 1.6s var(--ease);
  will-change:transform;
}
.mark img{display:block;height:var(--logo-h);width:auto;pointer-events:auto;cursor:pointer;transition:filter .6s ease;}
html.from-home .mark,
html.is-leaving .mark{transform:none;}
html.is-leaving .mark{transition-duration:1.4s;}
/* the next page's colour, falling over the screen under the logo */
.curtain{position:fixed;inset:0;z-index:15;pointer-events:none;will-change:transform;}
/* leaving for a dark page (Home, Contatti), it turns white on the way */
html.to-dark .mark img{filter:brightness(0) invert(1);}
/* the menu turns as the curtain's edge reaches it */
html.menu-dark .corner--tr a{color:#fff;transition:color .2s;}

/* ------------------------------------------------- the row of works -- */
/* An endless row of photos, 16:9, from --top down to the bottom edge; the
   wheel, a drag or a swipe slides it sideways (the script places each card
   and wraps it round, so it never runs out). */
.reel{position:fixed;left:0;right:0;top:var(--top);bottom:0;overflow:hidden;}
.w-card{
  position:absolute;left:0;bottom:0;height:min(88%,calc(68vw * 9 / 16));aspect-ratio:16/9;   /* sitting on the bottom edge */
  border-radius:14px 14px 0 0;overflow:hidden;background:var(--mist);cursor:pointer;
  will-change:transform;
}
.w-card img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.001);transition:transform .9s var(--ease);pointer-events:none;}
.w-card:hover img{transform:scale(1.045);}
.reel.is-dragging .w-card{cursor:grabbing;}

/* the project's name riding with the pointer over a photo */
.tag{
  position:fixed;left:0;top:0;z-index:25;pointer-events:none;margin:0;
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#fff;
  text-shadow:0 1px 10px rgba(7,24,88,.45);white-space:nowrap;
  opacity:0;transition:opacity .25s ease;
}
.tag::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(7,24,88,.35);}
.tag.is-on{opacity:1;}

/* ------------------------------------------------ the project page -- */
.project{
  position:fixed;inset:0;z-index:10;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  /* no padding at the foot: the next project's photo sits on the bottom edge */
  box-sizing:border-box;padding:calc(var(--pad) * 2 + 60px) var(--pad) 0;
  background:#fff;color:var(--navy);
  opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s;
  scrollbar-width:none;
}
.project::-webkit-scrollbar{display:none;}
/* opened from the row the page is see-through while the other photos slide away,
   and turns white once the photo has landed */
.project.is-open{opacity:1;visibility:visible;transition:opacity .45s ease,background-color .5s ease;}
.project.is-parting{background-color:transparent;}
/* white behind the menu, so the project page scrolls under it cleanly */
html.is-project body::before{content:'';position:fixed;z-index:15;top:0;left:0;right:0;height:calc(var(--pad) * 2 + 40px);background:#fff;}
.p-top,.p-hero,.p-body,.p-gallery,.p-next{max-width:1240px;margin-left:auto;margin-right:auto;}
.p-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.p-back{background:none;border:0;padding:6px 0;font:500 11px var(--font);letter-spacing:.12em;color:var(--navy);cursor:pointer;}
.p-back:hover{text-decoration:underline;text-underline-offset:5px;}
.p-count{font-size:10px;font-weight:500;letter-spacing:.2em;color:var(--muted);}
/* the photo runs down to the bottom edge of the screen */
.p-hero{height:calc(100vh - var(--pad) * 2 - 100px);height:calc(100dvh - var(--pad) * 2 - 100px);border-radius:14px 14px 0 0;overflow:hidden;}
.p-hero img,.p-next-pic img,.morph img{display:block;width:100%;height:100%;object-fit:cover;}
.project.is-arriving .p-hero{visibility:hidden;}
.p-body{margin-top:clamp(40px,6vw,90px);display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(28px,5vw,80px);}
.eyebrow{margin:0 0 12px;font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#334eac;}
.p-name{font-size:clamp(2.2rem,5vw,4.4rem);font-weight:500;letter-spacing:-.03em;line-height:1.02;margin:0 0 14px;}
.p-meta{margin:0;font-size:.8rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.p-list{list-style:none;margin:0;padding:0;}
.p-list li{padding:10px 0;border-top:1px solid var(--mist);line-height:1.5;font-size:.95rem;color:var(--body);}
.p-gallery{margin-top:clamp(56px,8vw,110px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.4vw,32px);align-items:start;}
.p-gallery:empty{display:none;}
.p-gallery img{display:block;width:100%;height:auto;border-radius:14px;}
.p-gallery img:nth-child(2){margin-top:clamp(60px,12vw,180px);}
.p-gallery img:only-child{grid-column:1/-1;width:min(100%,640px);justify-self:center;}
.p-next{display:block;width:100%;margin-top:clamp(90px,11vw,160px);padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;}
.p-next small{display:block;margin-bottom:10px;font-size:10px;font-weight:500;letter-spacing:.2em;color:var(--muted);}
.p-next-name{display:block;margin-bottom:24px;font-size:clamp(2rem,6vw,5rem);font-weight:500;letter-spacing:-.03em;line-height:1;transition:transform .5s var(--ease);}
.p-next:hover .p-next-name{transform:translateX(14px);}
.p-next-pic{display:block;height:clamp(160px,32vh,340px);border-radius:14px 14px 0 0;overflow:hidden;}
/* the text follows once the photo has landed */
.p-body,.p-gallery,.p-next{opacity:0;transform:translateY(30px);}
.project.is-shown .p-body,.project.is-shown .p-gallery,.project.is-shown .p-next{opacity:1;transform:none;transition:opacity .8s ease,transform .9s var(--ease);}
.project.is-shown .p-gallery{transition-delay:.12s;}
.project.is-shown .p-next{transition-delay:.24s;}
/* the travelling copy of a photo, card to hero */
.morph{position:fixed;z-index:30;border-radius:14px 14px 0 0;overflow:hidden;pointer-events:none;
  transition:left .9s cubic-bezier(.45,0,.2,1),top .9s cubic-bezier(.45,0,.2,1),width .9s cubic-bezier(.45,0,.2,1),height .9s cubic-bezier(.45,0,.2,1);}

@media (max-width:760px){
  :root{--dock-s:.42;--top:calc(var(--pad) * 2 + 70px);}
  /* on a phone the photos stand upright (4:5) and take most of the width */
  /* tall photos that fill most of the screen, still flush with the bottom edge */
  .w-card{width:auto;height:min(72%,calc(82vw * 5 / 3));aspect-ratio:3/5;}
  .corner--tr{gap:10px;font-size:12px;}
  .p-body,.p-gallery{grid-template-columns:1fr;}
  .p-gallery img:nth-child(2){margin-top:0;}
}
@media (prefers-reduced-motion:reduce){
  .w-card img,.mark{transition:none;}
}
</style>
</head>
<body>

<nav class="corner corner--tr" aria-label="Sezioni">
  <a href="index.html#home">[Home]</a>
  <a href="index.html#chi-siamo">[Studio]</a>
  <a href="lavori.html" aria-current="page">[Lavori]</a>
  <a href="index.html#contatti">[Contatti]</a>
</nav>

<div class="mark" aria-label="em studio"><img src="__EM__" alt=""><img src="__STUDIO__" alt=""></div>

<div class="reel" id="reel" aria-label="Lavori"></div>
<p class="tag" id="tag" aria-hidden="true"></p>

<section class="project" id="project" aria-label="Progetto" aria-hidden="true">
  <div class="p-top">
    <button class="p-back" type="button">← TUTTI I LAVORI</button>
    <span class="p-count"></span>
  </div>
  <div class="p-hero"><img alt=""></div>
  <div class="p-body">
    <div>
      <p class="eyebrow">Il progetto</p>
      <h2 class="p-name"></h2>
      <p class="p-meta"></p>
    </div>
    <div>
      <p class="eyebrow">Cosa abbiamo fatto</p>
      <ul class="p-list"></ul>
    </div>
  </div>
  <div class="p-gallery"></div>
  <button class="p-next" type="button">
    <small>PROGETTO SUCCESSIVO</small>
    <span class="p-next-name"></span>
    <span class="p-next-pic"><img alt=""></span>
  </button>
</section>

<script>
(function () {
  var projects = __DATA__;

  var root = document.documentElement,
      reel = document.getElementById('reel'),
      tag = document.getElementById('tag'),
      mark = document.querySelector('.mark'),
      N = projects.length,
      LEAVE = 1700,                            // ms the row takes to go, on the way to the home page
      still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pad(n) { return ('0' + n).slice(-2); }

  // one card per project; the script lays them out and wraps them round
  var cards = projects.map(function (p, i) {
    var a = reel.appendChild(document.createElement('a'));
    a.className = 'w-card';
    a.href = '#';
    a.setAttribute('aria-label', p.name + ' — ' + p.kind);
    a.innerHTML = '<img src="' + p.photos[0] + '" alt="" draggable="false">';
    a.addEventListener('click', function (e) { e.preventDefault(); if (!dragged && ready) choose(i, a); });
    return a;
  });

  /* The row: x is how far it has slid (px), easing toward tx. Each card's
     place is its slot minus x, wrapped into one loop of the whole row, so
     the row has no ends. */
  var step = 0, loop = 0, gapPx = 0, padPx = 0, x = 0, tx = 0, lastT = 0, riseStart = 0, leaveStart = 0, openIdx = -1,
      pivot = 0, part = 0,   // the opened card, and how far the others have parted from it (0 … 1)
      ready = still;   // no sliding by hand until the row has come in

  function measure() {
    // the CSS clamps (--gap, --pad) worked out here in px
    var w0 = innerWidth;
    gapPx = Math.min(60, Math.max(20, w0 * 0.034));
    padPx = Math.min(46, Math.max(16, w0 * 0.032));
    step = (cards[0].offsetWidth + gapPx) || 1;
    loop = step * N;
    // the logo's width, for docking it in the corner
    var w = 0;
    [].forEach.call(mark.querySelectorAll('img'), function (im) { w += im.offsetWidth; });
    root.style.setProperty('--logo-w', (w + w0 * 0.006) + 'px');
  }
  addEventListener('resize', measure);
  addEventListener('load', measure);
  measure();

  function frame(now) {
    if (leaveStart) {                         // leaving: the row slides off to the left, gathering speed
      var g = Math.min(1, (now - leaveStart) / LEAVE);
      tx = leaveFrom + g * g * innerWidth * 1.6;
      reel.style.opacity = (1 - g).toFixed(3);
    }
    // the same glide at any frame rate: 8.5% of the way per 60th of a second
    var dt = Math.min(100, now - (lastT || now));
    lastT = now;
    if (glide) glideStep(now);
    else x += (tx - x) * (still ? 1 : 1 - Math.pow(1 - 0.085, dt / 16.67));
    var start = padPx;
    // while a project is open the other photos part, off to the left and right of it
    if (openIdx >= 0) pivot = openIdx;
    part += ((openIdx >= 0 ? 1 : 0) - part) * (still ? 1 : 1 - Math.pow(1 - 0.035, dt / 16.67));
    var pp = ((pivot * step - x) % loop + loop) % loop;
    if (pp > loop - step) pp -= loop;
    for (var i = 0; i < N; i++) {
      var p = ((i * step - x) % loop + loop) % loop;   // 0 … loop
      if (p > loop - step) p -= loop;                  // the card just off the left edge
      if (i !== pivot) p += (p < pp ? -1 : 1) * part * innerWidth;
      // the opening: each card rises from below the screen, left to right
      var up = 0;
      if (riseStart) {
        var q = Math.max(0, Math.min(1, (now - riseStart - Math.max(0, p) / innerWidth * 380) / 1000));
        up = Math.pow(1 - q, 3) * (cards[i].offsetHeight + 60);
      }
      cards[i].style.transform = 'translate3d(' + (p + start).toFixed(1) + 'px,' + up.toFixed(1) + 'px,0)';
    }
    if (riseStart && now - riseStart > 1500) riseStart = 0;
    hovering();
    requestAnimationFrame(frame);
  }

  /* The name rides with the pointer over whichever photo is under it. The
     row moves under a still pointer, so this asks every frame instead of
     waiting for the pointer to enter or leave. */
  var mx = -1, my = -1, under = -1;
  function hovering() {
    var el = mx < 0 || openIdx >= 0 || leaveStart ? null : document.elementFromPoint(mx, my),
        c = el && el.closest ? el.closest('.w-card') : null,
        i = c ? cards.indexOf(c) : -1;
    if (i === under) return;
    under = i;
    if (i >= 0) tag.textContent = projects[i].name;
    tag.classList.toggle('is-on', i >= 0);
  }
  addEventListener('pointerleave', function () { mx = my = -1; });
  document.addEventListener('mouseleave', function () { mx = my = -1; });

  // wheel (either direction), drag and swipe all just move the target
  addEventListener('wheel', function (e) {
    if (!ready || openIdx >= 0) return;
    tx += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 1.1;
  }, { passive: true });
  var down = false, dragged = false, sx = 0, sy = 0, stx = 0;
  reel.addEventListener('pointerdown', function (e) {
    if (!ready || openIdx >= 0) return;
    down = true; dragged = false; sx = e.clientX; sy = e.clientY; stx = tx;
  });
  addEventListener('pointermove', function (e) {
    if (e.pointerType === 'mouse') { mx = e.clientX; my = e.clientY; }
    tag.style.transform = 'translate(' + (e.clientX + 16) + 'px,' + (e.clientY - 6) + 'px)';
    if (!down) return;
    // across or down, whichever way the finger goes most: a swipe up moves the row on, like a swipe left
    var dx = e.clientX - sx, dy = e.clientY - sy,
        d = Math.abs(dx) >= Math.abs(dy) ? dx : dy;
    if (Math.abs(d) > 6) { dragged = true; reel.classList.add('is-dragging'); }
    tx = stx - d * 1.4;
  });
  addEventListener('pointerup', function () {
    down = false; reel.classList.remove('is-dragging');
    setTimeout(function () { dragged = false; }, 0);   // the click after a drag is not a choice
  });
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape') return close();
    if (openIdx >= 0 || !ready) return;
    if (e.key === 'ArrowRight') tx += step;
    if (e.key === 'ArrowLeft') tx -= step;
  });

  /* A card off to the side slides to the middle first, then opens, in one
     movement: the row glides over on an ease-in-out (no slow tail), and as
     it eases into place the photo is already starting to grow. */
  var glide = null;   // { from, to, start, dur, i, a, opened }
  function choose(i, a) {
    var r = a.getBoundingClientRect(),
        off = r.left + r.width / 2 - innerWidth / 2;
    if (Math.abs(off) < 30 || still) return open(i, a);
    ready = false;
    glide = { from: x, to: x + off, start: performance.now(),
              dur: Math.min(800, 420 + Math.abs(off) * 0.35), i: i, a: a, opened: false };
  }
  function glideStep(now) {
    var g = glide, p = Math.min(1, (now - g.start) / g.dur),
        e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    x = tx = g.from + (g.to - g.from) * e;
    if (p > 0.82 && !g.opened) { g.opened = true; ready = true; open(g.i, g.a); }
    if (p >= 1) glide = null;
  }

  /* ---------------------------------------------- the project page -- */

  var page = document.getElementById('project'),
      hero = page.querySelector('.p-hero'),
      FLY = still ? 0 : 900;

  function fill(i) {
    var p = projects[i], nx = projects[(i + 1) % N];
    page.querySelector('.p-count').textContent = pad(i + 1) + ' / ' + pad(N);
    hero.querySelector('img').src = p.photos[0];
    page.querySelector('.p-name').textContent = p.name;
    page.querySelector('.p-meta').textContent = p.kind;
    var list = page.querySelector('.p-list');
    list.textContent = '';
    p.did.forEach(function (d) { list.appendChild(document.createElement('li')).textContent = d; });
    page.querySelector('.p-gallery').innerHTML = p.photos.slice(1).map(function (s) { return '<img src="' + s + '" alt="" loading="lazy">'; }).join('');
    page.querySelector('.p-next-name').textContent = nx.name;
    page.querySelector('.p-next-pic img').src = nx.photos[0];
    page.scrollTop = 0;
  }

  // the clicked photo flies from its place in the row into the hero
  function open(i, from) {
    if (openIdx >= 0) return;
    openIdx = i;
    tx = x;   // hold the row where it is
    under = -1;
    tag.classList.remove('is-on');
    var a = from.getBoundingClientRect();
    fill(i);
    root.classList.add('is-project');
    page.setAttribute('aria-hidden', 'false');
    page.classList.add('is-open', 'is-parting');
    fly(i, a);
  }

  /* A copy of the photo grows from where it was (rect a) into the hero at the
     top of the project page; the text follows once it has landed. */
  function fly(i, a) {
    page.classList.add('is-arriving');
    var b = hero.getBoundingClientRect(),
        m = document.createElement('div');
    m.className = 'morph';
    m.innerHTML = '<img src="' + projects[i].photos[0] + '" alt="">';
    m.style.cssText = 'left:' + a.left + 'px;top:' + a.top + 'px;width:' + a.width + 'px;height:' + a.height + 'px';
    document.body.appendChild(m);
    m.getBoundingClientRect();   // commit the start before moving
    m.style.cssText = 'left:' + b.left + 'px;top:' + b.top + 'px;width:' + b.width + 'px;height:' + b.height + 'px';
    setTimeout(function () {
      page.classList.remove('is-arriving', 'is-parting');
      page.classList.add('is-shown');
      m.remove();
    }, FLY);
  }

  function close() {
    if (openIdx < 0) return;
    openIdx = -1;
    root.classList.remove('is-project');
    page.setAttribute('aria-hidden', 'true');
    page.classList.remove('is-open', 'is-shown');
  }

  page.querySelector('.p-back').addEventListener('click', close);
  // the next project opens the way a card does: its photo at the foot of the
  // page grows into the hero, while the page goes back to the top under it
  page.querySelector('.p-next').addEventListener('click', function () {
    if (page.classList.contains('is-arriving')) return;
    var i = (openIdx + 1) % N,
        a = page.querySelector('.p-next-pic img').getBoundingClientRect();
    page.classList.remove('is-shown');   // the old text goes at once
    fill(i);                             // the new project, scrolled to the top
    openIdx = i;
    tx = x + step;                       // the row moves on one behind the page
    fly(i, a);
  });

  /* ------------------------------------------ back to the home page -- */

  // the logo takes the page back to its start: the project closed, the row back to the first photo
  mark.addEventListener('click', function () {
    if (leaveStart) return;
    if (openIdx >= 0) { close(); page.scrollTop = 0; }
    tx = Math.round(x / loop) * loop;   // the nearest turn of the loop where the first photo leads
  });

  /* Home, Studio and Contatti live on the home page. Rather than cut to it,
     the row slides away while the logo comes to the middle (white if the
     page it goes to is dark); the home page is told (sessionStorage) to
     start from that logo. */
  var leaveFrom = 0;
  function leave(href) {
    if (leaveStart) return;
    close();
    ready = false;
    leaveFrom = tx;
    leaveStart = performance.now();
    var light = /#chi-siamo$/.test(href);
    root.classList.add('is-leaving');
    // the colour of the page it goes to falls like a curtain; the logo turns as it passes
    var c = document.body.appendChild(document.createElement('div'));
    c.className = 'curtain';
    c.style.background = /#contatti$/.test(href) ? '#091956' : light ? '#ffffff' : '#334eac';
    if (!still) c.animate([{ transform: 'translateY(-100%)' }, { transform: 'none' }],
                          { duration: LEAVE, easing: 'cubic-bezier(0.65, 0, 0.35, 1)', fill: 'forwards' });
    setTimeout(function () { root.classList.toggle('to-dark', !light); }, still ? 0 : LEAVE * 0.5);
    // the ease is about 4t³ at the start, so the edge reaches the menu at the cube root
    var reach = Math.min(0.5, (document.querySelector('.corner--tr').getBoundingClientRect().bottom + 6) / innerHeight);
    if (!light) setTimeout(function () { root.classList.add('menu-dark'); }, still ? 0 : LEAVE * Math.cbrt(reach / 4));
    try { sessionStorage.setItem('em-from', 'lavori'); } catch (e) {}
    setTimeout(function () { location.href = href; }, still ? 0 : LEAVE);
  }
  [].forEach.call(document.querySelectorAll('.corner--tr a[href^="index.html"]'), function (a) {
    a.addEventListener('click', function (e) {
      if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // a new tab: just follow the link
      e.preventDefault();
      leave(a.href);
    });
  });
  // back from the home page through the browser's history: the page comes back as it was left
  addEventListener('pageshow', function (e) {
    if (!e.persisted || !leaveStart) return;
    leaveStart = 0;
    ready = true;
    tx = x = leaveFrom;
    reel.style.opacity = '';
    [].forEach.call(document.querySelectorAll('.curtain'), function (c) { c.remove(); });
    root.classList.remove('is-leaving', 'to-dark', 'menu-dark');
  });

  /* ------------------------------------------------------ the arrival -- */

  // from the home page the logo is already whole in the middle: commit that
  // place before it moves, or it would glide in from the corner instead
  var fromHome = false;
  try { fromHome = sessionStorage.getItem('em-from') === 'home'; sessionStorage.removeItem('em-from'); } catch (e) {}
  // placed there with no transition: the page's first style already had it in the corner
  if (fromHome) { mark.style.transition = 'none'; root.classList.add('from-home'); mark.getBoundingClientRect(); }

  /* The photos rise into place from below, one after another, while the logo
     docks. Both wait until the photos are decoded (at most 1.2s): moving while
     the page is still loading is what made the logo stutter. Until then the
     photos wait below the screen. */
  x = tx = 0;
  riseStart = still ? 0 : Infinity;
  requestAnimationFrame(frame);
  function begin() {
    if (begin.done) return;
    begin.done = true;
    requestAnimationFrame(function () {
      mark.style.transition = '';
      root.classList.remove('from-home');
      if (!still) riseStart = performance.now() + (fromHome ? 150 : 250);
      setTimeout(function () { ready = true; }, still ? 0 : 1200);
    });
  }
  Promise.all(cards.map(function (a) { var im = a.firstChild; return im.decode ? im.decode().catch(function () {}) : 0; })).then(begin);
  setTimeout(begin, 1200);
})();
</script>
